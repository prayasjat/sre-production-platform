apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: "simple-sre-api"
        metrics_path: /metrics

        static_configs:
          - targets:
              - "simple-sre-api.default.svc.cluster.local:80"
